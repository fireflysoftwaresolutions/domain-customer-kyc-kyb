name: Reproofing Domain source
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fireflysoftwaresolutions/firefly-parent
          ref: 6442bd51733ade4d5f4583e1afe812dd2c520b40
          path: .qualification/firefly-parent
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - id: core
        run: echo "pin=$(cat tooling/reproofing-core-source.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fireflysoftwaresolutions/core-common-kycb-mgmt
          ref: ${{ steps.core.outputs.pin }}
          path: .qualification/core
      - name: YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Exact producer, generated SDK and full Domain reactor
        run: python3 tooling/prepare_reproofing_sdk_fixture.py
      - name: Source provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproofing-domain-source
          path: |
            .qualification/reproofing-sdk-summary.json
            .qualification/*.log
          if-no-files-found: ignore
          retention-days: 7
